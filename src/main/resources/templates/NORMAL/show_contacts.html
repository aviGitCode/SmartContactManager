<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{NORMAL/Base::layout(~{::section})}">
<head>
    <meta charset="UTF-8" />
    <title>this is home page</title>
</head>
<body>

<section class="show-contacts-main-section">

    <div class="alert-container mr-10">

        <div th:if="${session.message}"
             th:classappend="${session.message.type}" class="alert-message">
            <p th:text="${session.message.content}"></p>

            <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>

        </div>

        <h1 class="contacts-table-header">Add Contact View</h1>
        <table class="contacts-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Action1</th>
                </tr>
            </thead>
            <tbody>

                <tr th:each="c:${contacts}">
                    <td th:text="${c.cId}">1</td>

                    <td><img class="profile-pic" alt="profile Photo"
                             th:src="@{'/img/'+${c.image}}" src=""> 
                        <span th:text="${c.name}"></span>
                    </td>

                    <td><a href="#" th:href="@{'/user/contact/'+${c.cId}}" > 
                        <span th:text="${c.email}" class="contact-link"></span>
                    </a></td>

                    <td th:text="${c.phone}">123-456-7890</td>

                    <td class="action-buttons-cell">
                        <div class="action-buttons-container">
                            <!-- Delete Button -->
                            <a href="#" th:href="@{'/user/Delete/'+${c.cId}}">
                                <button type="button" class="btn-delete">Delete</button>
                            </a>

                            <!-- Update Button -->
                            <a th:href="@{'/user/update-contact/'+${c.cId}}">
                                <button type="submit" class="btn-update">Update</button>
                            </a>
                        </div>
                    </td>
                </tr>

            </tbody>
        </table>

        <!-- Pagination bar -->
        <nav aria-label="Page navigation example">
            <ul class="pagination-list">

                <li th:if="${currentPage != 0}" class="page-item">
                    <a th:href="@{'/user/show-contacts/'+${currentPage-1}}"
                       class="page-link" href="#">Previous</a>
                </li>

                <li th:classappend="${currentPage==i-1?'active':''}"
                    th:each="i : ${#numbers.sequence(1,totalPage)}" class="page-item">
                    <a class="page-link" th:href="@{'/user/show-contacts/'+${i-1}}"
                       href="#"><span th:text="${i}"></span></a>
                </li>

                <li th:if="${currentPage+1 != totalPage }" class="page-item">
                    <a th:href="@{'/user/show-contacts/'+${currentPage+1}}"
                       class="page-link" href="#">Next</a>
                </li>
            </ul>
        </nav>

    </div>

</section>

</body>
</html>
